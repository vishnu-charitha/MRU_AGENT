version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Optional overrides for local docker-compose
      - FRONTEND_URL=http://localhost:5173
    networks:
      - mrdu_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    networks:
      - mrdu_net

networks:
  mrdu_net:
    driver: bridge
